<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 模組翻譯工具</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js" defer></script>
</head>
<body>
    <!-- 🎮 翻譯控制面板 -->
    <div class="control-panel">
        <div class="form-group">
            <label for="input-path">待翻譯路徑:</label>
            <div class="input-row">
                <input type="text" id="input-path" placeholder="輸入或拖放路徑至此...">
                <button id="btn-browse-file" class="action-btn">📂 檔案</button>
                <button id="btn-browse-dir" class="action-btn">📁 資料夾</button>
            </div>
        </div>

        <!-- [NEW] 輸出路徑 (100% 復刻) -->
        <div class="form-group" style="margin-top: 10px;">
            <label for="output-dir">輸出路徑:</label>
            <div class="input-row">
                <input type="text" id="output-dir" placeholder="./LLMTranslator (預設)">
                <button id="btn-browse-output" class="action-btn">📁 瀏覽</button>
                <button id="btn-browse-output-open" class="action-btn">📂 打開</button>
            </div>
        </div>

        <!-- [NEW] 介面語言與導航列 (100% 復刻) -->
        <div class="form-group" style="margin-top: 10px;">
            <label for="ui-lang">介面語言:</label>
            <select id="ui-lang" style="max-width: 150px; padding: 6px;">
                <option value="zh_tw">繁體中文 (zh_tw)</option>
                <option value="zh_cn">简体中文 (zh_cn)</option>
                <option value="ja_jp">日本語 (ja_jp)</option>
                <option value="en_us">English (en_us)</option>
            </select>
        </div>

        <div class="button-row" style="margin-top: 15px;">
            <button id="btn-translate">🚀 立即翻譯</button>
            <button id="btn-pause" style="display: none;">⏸️ 暫停</button>
            <button id="btn-resume" style="display: none;">▶️ 繼續</button>
            <button id="btn-stop" style="display: none; background-color: #aa1111;">⏹️ 停止</button>
            
            <!-- [NEW] 導航列 -->
            <div style="flex: 1; display: flex; justify-content: flex-end; gap: 8px;">
                <button id="btn-nav-api" class="secondary-btn" title="API 與常數設置">⚙️</button>
                <button id="btn-nav-dict" class="secondary-btn" title="字典管理器">📖</button>
                <button id="btn-nav-palette" class="secondary-btn" title="佈景與色彩管理">🎨</button>
                <button id="btn-nav-theme" class="secondary-btn" title="切換 Light/Dark 主題">🌓</button>
                <button id="btn-nav-dev" class="secondary-btn" title="開發者過濾選項">🔧</button>
            </div>
        </div>
    </div>

    <!-- ⚙️ API 與常規參數面板 (100% 復刻) -->
    <div class="control-panel api-settings" style="display: none;">
        <h2 id="header-api-settings">⚙️ API 與常規參數設定</h2>
        <div class="form-grid">
            <div class="form-group">
                <label for="api-provider">服務提供商</label>
                <select id="api-provider">
                    <option value="Gemini">Gemini (Google)</option>
                    <option value="OpenAI">OpenAI</option>
                    <option value="DeepSeek">DeepSeek</option>
                    <option value="Mistral">Mistral</option>
                    <option value="DeepL">DeepL</option>
                    <option value="Ollama">Ollama (本地端)</option>
                    <option value="Google Free">Google Free</option>
                    <option value="無">無 (None)</option>
                </select>
            </div>
            <div class="form-group" id="api-key-group">
                <label for="api-key">API 金鑰</label>
                <input type="password" id="api-key" placeholder="輸入 API Key...">
            </div>
            <div class="form-group">
                <label for="selected-model">模型名稱</label>
                <select id="selected-model"></select>
            </div>
            <div class="form-group" id="ollama-url-group" style="display: none;">
                <label for="ollama-url">Ollama URL</label>
                <input type="text" id="ollama-url">
            </div>
            <div class="form-group">
                <label for="batch-size">單批次條目數</label>
                <input type="number" id="batch-size" min="1" max="300">
            </div>
            <div class="form-group">
                <label for="batch-max-chars">批次最大字數</label>
                <input type="number" id="batch-max-chars" step="100">
            </div>
            <div class="form-group">
                <label for="timeout-sec">API 超時秒數</label>
                <input type="number" id="timeout-sec" min="5">
            </div>
            <div class="form-group">
                <label for="glossary-priority">術語優先級</label>
                <select id="glossary-priority">
                    <option value="official">官方推論優先</option>
                    <option value="user">使用者詞庫優先</option>
                </select>
            </div>
            <div class="form-group">
                <label for="pack-format">資源包格式</label>
                <!-- [NEW] 使用 Select 以復刻常用版本下拉 -->
                <select id="pack-format">
                    <option value="46">1.21.4 (46)</option>
                    <option value="42">1.21.2 (42)</option>
                    <option value="34">1.21 (34)</option>
                    <option value="22">1.20.4 (22)</option>
                    <option value="18">1.20.2 (18)</option>
                    <option value="15" selected>1.20.1 (15)</option>
                    <option value="13">1.19.4 (13)</option>
                    <option value="10">1.19.2 (10)</option>
                    <option value="9">1.18.2 (9)</option>
                    <option value="6">1.16.5 (6)</option>
                </select>
            </div>
        </div>

        <!-- [NEW] 自訂 Prompts 設定區 -->
        <div style="margin-top: 15px;">
            <div class="form-group" style="margin-top: 10px;">
                <label for="user-prompt">使用者翻譯提示:</label>
                <textarea id="user-prompt" rows="3" style="width: 100%; box-sizing:border-box; background: var(--input-bg); color: #fff; border: 1px solid #333; border-radius: 4px; padding: 8px;"></textarea>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="btn-save-config" style="background-color: var(--accent-color); color: #111; flex: 1;">💾 儲存核心參數</button>
            <button id="btn-restore-config" class="secondary-btn" style="background-color: #444; flex: 1; color: #fff; border: 1px solid #555;">🔄 恢復預設參數</button>
        </div>
    </div>

    <!-- 🔧 開發人員選項 -->
    <div class="control-panel developer-settings" style="display: none;">
        <h2 id="header-dev-mode">🔧 開發人員檔案過濾</h2>
        <div class="checkbox-grid">
            <div class="switch-group">
                <span id="label-skip-json">跳過 .json 檔案</span>
                <label class="switch"><input type="checkbox" id="chk-skip-json"><span class="slider round"></span></label>
            </div>
            <div class="switch-group">
                <span id="label-skip-js">跳過 .js 檔案</span>
                <label class="switch"><input type="checkbox" id="chk-skip-js"><span class="slider round"></span></label>
            </div>
            <div class="switch-group">
                <span id="label-skip-jar">跳過 .jar 檔案</span>
                <label class="switch"><input type="checkbox" id="chk-skip-jar"><span class="slider round"></span></label>
            </div>
            <div class="switch-group">
                <span id="label-skip-book">跳過 Patchouli 手冊</span>
                <label class="switch"><input type="checkbox" id="chk-skip-book"><span class="slider round"></span></label>
            </div>
            <hr style="grid-column: 1 / -1; width: 100%; border-color: #444;">
            <div class="switch-group" style="grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;">
                <span id="label-enable-llm-log">記錄 LLM 通訊日誌</span>
                <label class="switch"><input type="checkbox" id="chk-llm-log"><span class="slider round"></span></label>
            </div>
            <div class="form-group" style="grid-column: 1 / -1; margin-top: 10px;">
                <label for="system-prompt">系統技術指令:</label>
                <textarea id="system-prompt" rows="3" style="width: 100%; box-sizing:border-box; background: var(--input-bg); color: #fff; border: 1px solid #333; border-radius: 4px; padding: 8px;"></textarea>
            </div>
        </div>
    </div>

    <!-- 🎨 調色盤與佈局管理面板 -->
    <div class="control-panel theme-settings" style="display: none;">
        <h2 id="header-palette">🎨 調色盤與佈局管理</h2>
        <div class="form-grid">
            <div class="form-group">
                <label for="palette-target-type">編輯對象</label>
                <select id="palette-target-type" style="width: 100%;">
                    <option value="global">全域樣式</option>
                    <option value="specific">特定元件覆寫</option>
                </select>
            </div>
            <div class="form-group">
                <label for="palette-target-item">選擇對象</label>
                <select id="palette-target-item" style="width: 100%;">
                    <!-- 全域類別 -->
                    <optgroup label="全域類別" id="group-global">
                        <option value="dark_bg">背景顏色</option>
                        <option value="dark_text">文字顏色</option>
                        <option value="dark_btn_bg">按鈕背景</option>
                        <option value="dark_btn_text">按鈕文字</option>
                        <option value="dark_input_bg">輸入框背景</option>
                        <option value="dark_list_bg">日誌與列表背景</option>
                        <option value="dark_tab_active">分頁背景 (選中)</option>
                        <option value="dark_tab_inactive">分頁背景 (未選中)</option>
                    </optgroup>
                    <!-- 特定元件 (透過 JS 控制覆寫) -->
                    <optgroup label="特定元件" id="group-specific" style="display: none;">
                        <option value="btn-translate">🚀 立即翻譯按鈕</option>
                        <option value="btn-pause">⏸️ 暫停按鈕</option>
                        <option value="btn-stop">⏹️ 停止按鈕</option>
                        <option value="btn-browse-file">📁 開啟單檔按鈕</option>
                        <option value="btn-browse-dir">📁 開啟資料夾按鈕</option>
                        <option value="btn-browse-output">📁 瀏覽輸出按鈕</option>
                        <option value="btn-browse-output-open">📂 打開輸出按鈕</option>
                        <option value="user-prompt">📝 使用者提示詞框</option>
                        <option value="system-prompt">🔧 系統提示詞框</option>
                        <option value="input-path">🔗 來源路徑輸入框</option>
                        <option value="output-dir">🔗 輸出路徑輸入框</option>
                        <option value="dict-dialog">📖 字典視窗</option>
                        <option value="log-output">📋 日誌輸出框</option>
                        <option value="progress-bar">📊 檔案進度條</option>
                        <option value="batch-progress-bar">📊 條目進度條</option>
                    </optgroup>
                </select>
            </div>
            <!-- [NEW] 屬性選擇 -->
            <div class="form-group" id="palette-property-group" style="display: none;">
                <label for="palette-property">設定屬性</label>
                <select id="palette-property" style="width: 100%;">
                    <option value="bg">背景顏色</option>
                    <option value="text">文字顏色</option>
                    <option value="rounding">圓角大小</option>
                </select>
            </div>
            <div class="form-group" id="palette-color-group">
                <label for="palette-color" id="label-palette-color">調整顏色</label>
                <input type="color" id="palette-color" style="width: 100%; height: 38px; padding: 0; border: 1px solid #444; cursor: pointer; border-radius: 4px;">
            </div>
            <div class="form-group" id="palette-rounding-group" style="display: none;">
                <label for="palette-rounding">圓角數值</label>
                <input type="number" id="palette-rounding" value="4" min="0" max="20" step="1" style="width: 100%;">
            </div>
            <!-- [NEW] 特定元件歸零按鈕 -->
            <div class="form-group" id="palette-clear-group" style="display: none; align-items: flex-end;">
                <button id="btn-palette-clear-item" class="action-btn" style="background-color: #aa1111; color: #fff; width: 100%; height: 38px;">🗑 清除元件覆寫</button>
            </div>
        </div>
        <!-- [NEW] 字體大小與圓角/動畫設定 -->
        <div class="form-grid" style="margin-top: 15px;">
            <div class="form-group">
                <label for="font-size">字體大小:</label>
                <input type="number" id="font-size" value="15" min="12" max="30" step="0.5">
            </div>
            <div class="form-group">
                <label for="btn-rounding-value">全局圓角:</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="checkbox" id="chk-btn-rounding" checked style="width: 20px;">
                    <input type="number" id="btn-rounding-value" value="4" min="0" max="20" step="1" style="flex: 1;">
                </div>
            </div>
            <div class="form-group">
                <label for="pulse-speed">進度條光暈速度:</label>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="checkbox" id="chk-pulse" checked style="width: 20px;">
                    <input type="number" id="pulse-speed" value="1.0" min="0.1" max="5.0" step="0.1" style="flex: 1;">
                </div>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="btn-save-style" style="flex: 1;">💾 儲存佈景配置</button>
            <button id="btn-restore-style" class="secondary-btn" style="background-color: #444; flex: 1; color: #fff; border: 1px solid #555;">🔄 恢復預設樣式</button>
        </div>
    </div>

    <!-- 進度與日誌面板 -->
    <div class="status-section">
        <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px;">
            <span id="label-items" style="color: #aaa;">條目</span>
            <span id="batch-status-text" style="color: #aaa; display: none;">0 / 0</span>
        </div>
        <div id="batch-progress-container" style="height: 6px; margin-bottom: 8px; background-color: #222; border-radius: 3px; overflow: hidden; display: none;">
            <div id="batch-progress-bar" style="background-color: #88c0d0; width: 0%; height: 100%; transition: width 0.2s;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px;">
            <span id="label-files" style="color: #ddd; font-weight: bold;">檔案</span>
            <span id="status-text" style="color: #ddd;">未開始</span>
        </div>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="log-output" style="margin-top: 10px;"></div>
    </div>

    <!-- 📖 字典管理器彈窗 -->
    <dialog id="dict-dialog" class="styled-dialog">
        <div class="dialog-header">
            <h3 id="header-dict-mgr">📖 字典管理器</h3>
            <div class="search-bar"><input type="text" id="dict-search" placeholder="🔍 搜尋術語..."></div>
            <button class="close-icon" onclick="document.getElementById('dict-dialog').close()">×</button>
        </div>
        <div class="dialog-body">
            <div class="tabs">
                <button class="tab-btn active" id="tab-user">使用者詞庫</button>
                <button class="tab-btn" id="tab-official">官方推論</button>
            </div>
            <!-- [NEW] 字典操作區 (僅限使用者詞庫) -->
            <div id="dict-user-controls" style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
                <input type="text" id="dict-input-key" placeholder="原文 (Key)" style="flex: 1; min-width: 150px;">
                <input type="text" id="dict-input-value" placeholder="翻譯 (Value)" style="flex: 1; min-width: 150px;">
                <button id="btn-dict-add" class="action-btn" style="background-color: var(--accent-color); color: #000;">➕ 新增</button>
                <button id="btn-dict-replace" class="action-btn" style="background-color: #666; color: #fff;">🔄 取代</button>
                <button id="btn-dict-clear" class="action-btn" style="background-color: #aa1111; color: #fff;">🗑 清空全部</button>
                <button id="btn-dict-import" class="action-btn" style="background-color: #444; color: #fff;">📥 匯入</button>
                <button id="btn-dict-export" class="action-btn" style="background-color: #444; color: #fff;">📤 匯出</button>
            </div>
            <div class="table-container" id="dict-table-container"></div>
        </div>
        <div class="dialog-footer">
            <div class="pagination">
                 <button id="page-prev" class="page-btn">上一頁</button>
                 <span id="page-info">第 1 / 1 頁</span>
                 <button id="page-next" class="page-btn">下一頁</button>
            </div>
        </div>
    </dialog>
</body>
</html>
