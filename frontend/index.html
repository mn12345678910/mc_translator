<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Minecraft Mod Translator</title>
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="main.js" defer></script>
    </head>
    <body>
        <header class="top-navbar">
            <div class="nav-links" style="margin-left: auto">
                <button
                    id="btn-nav-api"
                    class="secondary-btn"
                    title="API & Settings"
                    data-i18n-title="btn_nav_settings"
                >
                    ⚙️
                </button>
                <button
                    id="btn-nav-dict"
                    class="secondary-btn"
                    title="Suggestion Manager"
                    data-i18n-title="btn_nav_dict"
                >
                    📖
                </button>
                <button
                    id="btn-nav-palette"
                    class="secondary-btn"
                    title="Theme & Palette"
                    data-i18n-title="btn_nav_palette"
                >
                    🎨
                </button>
                <button
                    id="btn-nav-theme"
                    class="secondary-btn"
                    title="Toggle Light/Dark Theme"
                    data-i18n-title="btn_nav_theme"
                >
                    🌓
                </button>
                <button id="btn-nav-dev" class="secondary-btn" title="Developer Options" data-i18n-title="btn_nav_dev">
                    🔧
                </button>
            </div>
        </header>

        <!-- 🎮 翻譯控制面板 -->
        <div class="control-panel">
            <div class="form-group">
                <div class="label-row">
                    <label for="input-path" data-i18n="label_input_path">:</label>
                    <div class="row-buttons">
                        <button id="btn-browse-file" class="action-btn" data-i18n="btn_select_file">
                            📂Select File
                        </button>
                        <button id="btn-browse-dir" class="action-btn" data-i18n="btn_select_folder">
                            📁Select Folder
                        </button>
                    </div>
                </div>
                <div class="input-row">
                    <input
                        type="text"
                        id="input-path"
                        placeholder="Enter or drag path here..."
                        data-i18n-placeholder="placeholder_input_path"
                        autocomplete="off"
                    />
                    <button
                        class="clear-btn action-btn danger-hover"
                        onclick="document.getElementById('input-path').value = ''"
                        data-i18n-title="btn_clear"
                        title="Clear"
                    >
                        ❌
                    </button>
                </div>
            </div>

            <!-- [NEW] 輸出路徑 (100% 復刻) -->
            <div class="form-group mt-sm">
                <div class="label-row">
                    <label for="output-dir" data-i18n="label_output_path">Output Folder Path:</label>
                    <div class="row-buttons">
                        <button id="btn-browse-output" class="action-btn" data-i18n="btn_output_dir">
                            📁Select Folder
                        </button>
                        <button id="btn-browse-output-open" class="action-btn" data-i18n="btn_open_output">
                            📂Open Folder
                        </button>
                    </div>
                </div>
                <div class="input-row">
                    <input
                        type="text"
                        id="output-dir"
                        placeholder="./LLMTranslator (Default)"
                        data-i18n-placeholder="placeholder_output_path"
                        autocomplete="off"
                    />
                    <button
                        class="clear-btn action-btn danger-hover"
                        onclick="document.getElementById('output-dir').value = ''"
                        data-i18n-title="btn_clear"
                        title="Clear"
                    >
                        ❌
                    </button>
                </div>
            </div>

            <!-- [NEW] 介面語言與導航列 (100% 復刻) -->
            <div class="form-group mt-sm" style="display: flex; flex-direction: row; align-items: center; gap: 8px">
                <label for="ui-lang" data-i18n="label_ui_lang">:</label>
                <select id="ui-lang" style="max-width: 150px; padding: 6px">
                    <option value="zh_tw">繁體中文 (zh_tw)</option>
                    <option value="zh_cn">Simplified Chinese (zh_cn)</option>
                    <option value="ja_jp">Japanese (ja_jp)</option>
                    <option value="en_us">English (en_us)</option>
                </select>
            </div>

            <div class="button-row mt-md">
                <button id="btn-translate" data-i18n="btn_run_trans">▶</button>
                <button id="btn-pause" style="display: none" data-i18n="btn_pause">⏸️</button>
                <button id="btn-resume" style="display: none" data-i18n="btn_resume">▶</button>
                <button id="btn-stop" style="display: none; background-color: var(--danger-color)" data-i18n="btn_stop">
                    ⏹️
                </button>
                <span
                    id="status-prefix"
                    class="status-label ml-md"
                    style="margin-left: 15px; color: var(--text-muted)"
                    data-i18n="label_current_status"
                    >Current Status:
                </span>
                <span
                    id="current-status-label"
                    class="status-label"
                    data-i18n="status_idle"
                    style="color: var(--text-muted)"
                    >Idle</span
                >
            </div>
        </div>

        <!-- ⚙️ API 與常規參數面板 (100% 復刻) -->
        <div class="control-panel api-settings collapsible-panel">
            <h2 id="header-api-settings" data-i18n="header_api_settings">⚙️ API</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="api-provider" data-i18n="label_provider"></label>
                    <select id="api-provider">
                        <option value="Gemini">Gemini (Google)</option>
                        <option value="OpenAI">OpenAI</option>
                        <option value="DeepSeek">DeepSeek</option>
                        <option value="Mistral">Mistral</option>
                        <option value="DeepL">DeepL</option>
                        <option value="Ollama">Ollama (Local)</option>
                        <option value="Google Free">Google Free</option>
                        <option value="無">None</option>
                    </select>
                </div>
                <div class="form-group" id="api-key-group">
                    <label for="api-key" data-i18n="label_api_key">API</label>
                    <input
                        type="password"
                        id="api-key"
                        placeholder="Enter API Key..."
                        data-i18n-placeholder="placeholder_api_key"
                        autocomplete="off"
                        autocomplete="new-password"
                    />
                </div>
                <div class="form-group">
                    <label for="selected-model" data-i18n="label_model"></label>
                    <select id="selected-model"></select>
                </div>
                <div class="form-group" id="ollama-url-group" style="display: none">
                    <label for="ollama-url" data-i18n="label_ollama_url">Ollama URL</label>
                    <input type="text" id="ollama-url" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="batch-size" data-i18n="label_batch_size"></label>
                    <input type="number" id="batch-size" min="1" max="300" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="batch-max-chars" data-i18n="label_max_chars"></label>
                    <input type="number" id="batch-max-chars" step="100" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="timeout-sec" data-i18n="label_timeout">API</label>
                    <input type="number" id="timeout-sec" min="5" autocomplete="off" />
                </div>
            </div>

            <div class="form-grid" style="margin-top: 15px">
                <div class="form-group">
                    <label for="source-lang" id="label-source-lang" data-i18n="label_source_lang"></label>
                    <select id="source-lang">
                        <option value="en_us">English (US)</option>
                        <option value="zh_tw">Traditional Chinese</option>
                        <option value="zh_cn">Simplified Chinese</option>
                        <option value="ja_jp">Japanese</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="target-lang" id="label-target-lang" data-i18n="label_target_lang"></label>
                    <select id="target-lang">
                        <option value="zh_tw">Traditional Chinese</option>
                        <option value="en_us">English (US)</option>
                        <option value="zh_cn">Simplified Chinese</option>
                        <option value="ja_jp">Japanese</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pack-format" data-i18n="label_pack_format"></label>
                    <!-- [NEW] 使用 Select 以復刻常用版本下拉 -->
                    <select id="pack-format">
                        <option value="46">1.21.4 (46)</option>
                        <option value="42">1.21.2 (42)</option>
                        <option value="34">1.21 (34)</option>
                        <option value="22">1.20.4 (22)</option>
                        <option value="18">1.20.2 (18)</option>
                        <option value="15" selected>1.20.1 (15)</option>
                        <option value="13">1.19.4 (13)</option>
                        <option value="10">1.19.2 (10)</option>
                        <option value="9">1.18.2 (9)</option>
                        <option value="6">1.16.5 (6)</option>
                    </select>
                </div>
            </div>

            <!-- [NEW] 自訂 Prompts 設定區 -->
            <div style="margin-top: 15px">
                <div class="form-group" style="margin-top: 10px">
                    <label for="user-prompt" data-i18n="label_user_prompt">:</label>
                    <textarea id="user-prompt" rows="3" autocomplete="off"></textarea>
                </div>
            </div>
            <div class="button-row mt-md" style="justify-content: flex-end">
                <button
                    id="btn-restore-api"
                    class="action-btn"
                    data-i18n="btn_restore_defaults"
                    style="background-color: var(--secondary-color)"
                >
                    ⟲
                </button>
            </div>
        </div>

        <!-- 🔧 開發人員選項 -->
        <div class="control-panel developer-settings collapsible-panel">
            <h2 id="header-dev-mode" data-i18n="header_dev_mode">🔧</h2>
            <div class="checkbox-grid">
                <div class="switch-group">
                    <span id="label-skip-json" data-i18n="label_skip_json">.json</span>
                    <label class="switch"
                        ><input type="checkbox" id="chk-skip-json" /><span class="slider round"></span
                    ></label>
                </div>
                <div class="switch-group">
                    <span id="label-skip-js" data-i18n="label_skip_js">.js</span>
                    <label class="switch"
                        ><input type="checkbox" id="chk-skip-js" /><span class="slider round"></span
                    ></label>
                </div>
                <div class="switch-group">
                    <span id="label-skip-jar" data-i18n="label_skip_jar">.jar</span>
                    <label class="switch"
                        ><input type="checkbox" id="chk-skip-jar" /><span class="slider round"></span
                    ></label>
                </div>
                <div class="switch-group">
                    <span id="label-skip-book" data-i18n="label_skip_book">Patchouli</span>
                    <label class="switch"
                        ><input type="checkbox" id="chk-skip-book" /><span class="slider round"></span
                    ></label>
                </div>
            </div>

            <div class="checkbox-grid" style="margin-top: 15px">
                <div class="switch-group">
                    <span id="label-llm-log">LLM</span>
                    <label class="switch">
                        <input type="checkbox" id="chk-llm-log" />
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="switch-group">
                    <span id="label-debug-log" data-i18n="label_enable_debug_log">Debug Log (.log)</span>
                    <label class="switch">
                        <input type="checkbox" id="chk-debug-log" />
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>

            <!-- [NEW] 排除路徑設定區 -->
            <div style="margin-top: 15px">
                <div class="form-group" style="margin-top: 10px">
                    <label for="excluded-paths" data-i18n="label_excluded_paths"></label>
                    <textarea
                        id="excluded-paths"
                        rows="4"
                        autocomplete="off"
                        data-i18n-placeholder="placeholder_excluded_paths"
                    ></textarea>
                </div>
            </div>

            <!-- [NEW] 系統技術指令 (開發人員專用) -->
            <div style="margin-top: 15px">
                <div class="form-group" style="margin-top: 10px">
                    <label for="system-prompt"
                        ><span data-i18n="label_system_prompt">📜 System Instructions</span>:</label
                    >
                    <textarea id="system-prompt" rows="5" style="margin-top: 4px" autocomplete="off"></textarea>
                </div>
            </div>
            <div class="button-row mt-md" style="justify-content: flex-end">
                <button
                    id="btn-restore-dev"
                    class="action-btn"
                    data-i18n="btn_restore_defaults"
                    style="background-color: var(--secondary-color)"
                >
                    ⟲
                </button>
            </div>
        </div>

        <!-- 🎨 調色盤與佈局管理面板 -->
        <div class="control-panel theme-settings collapsible-panel">
            <h2 id="header-palette" data-i18n="header_palette">🎨</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="palette-target-type" data-i18n="label_palette_target_type"></label>
                    <select id="palette-target-type" style="width: 100%">
                        <option value="global" data-i18n="group_batch"></option>
                        <option value="specific" data-i18n="group_specific"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="palette-target-item" data-i18n="label_palette_target_item"></label>
                    <select id="palette-target-item" style="width: 100%">
                        <!-- Global Categories -->
                        <optgroup data-i18n-label="group_batch" id="group-global">
                            <option value="dark_bg" data-i18n="cat_all_bg"></option>
                            <option value="dark_text" data-i18n="cat_all_text"></option>
                            <option value="dark_accent" data-i18n="cat_accent_color"></option>
                            <option value="dark_danger" data-i18n="cat_danger_color"></option>
                            <option value="dark_label" data-i18n="cat_all_labels"></option>
                            <option value="dark_text_muted" data-i18n="cat_text_muted"></option>
                            <option value="dark_header_bg" data-i18n="cat_header_bg"></option>
                            <option value="dark_btn_bg" data-i18n="cat_all_buttons"></option>
                            <option value="dark_btn_text" data-i18n="cat_all_btn_text"></option>
                            <option value="dark_input_bg" data-i18n="cat_all_inputs"></option>
                            <option value="dark_list_bg" data-i18n="cat_all_logs"></option>
                            <option value="dark_tab_active" data-i18n="cat_all_tab_active"></option>
                            <option value="dark_tab_inactive" data-i18n="cat_all_tab_inactive"></option>
                            <option value="dark_border_color" data-i18n="cat_border_color"></option>
                            <option value="dark_hover_bg" data-i18n="cat_hover_bg"></option>
                            <option value="dark_slider_bg" data-i18n="cat_slider_bg"></option>
                            <option value="dark_slider_thumb" data-i18n="cat_slider_thumb"></option>
                            <option value="dark_switch_bg" data-i18n="cat_switch_bg"></option>
                            <option value="dark_progress_bg" data-i18n="cat_progress_bg"></option>
                            <option value="aurora_1" data-i18n="cat_aurora_start"></option>
                            <option value="aurora_2" data-i18n="cat_aurora_mid"></option>
                            <option value="aurora_3" data-i18n="cat_aurora_end"></option>
                            <option value="neon_color" data-i18n="cat_neon_color"></option>
                        </optgroup>
                        <!-- Layout & Params -->
                        <optgroup data-i18n-label="group_layout" id="group-layout">
                            <option value="space_sm" data-i18n="label_space_sm"></option>
                            <option value="space_md" data-i18n="label_space_md"></option>
                            <option value="space_lg" data-i18n="label_space_lg"></option>
                            <option value="border_alpha" data-i18n="label_alpha_border"></option>
                            <option value="panel_alpha" data-i18n="label_alpha_panel"></option>
                            <option value="backdrop_alpha" data-i18n="label_alpha_backdrop"></option>
                            <option value="font_size" data-i18n="label_font_size"></option>
                        </optgroup>
                        <!-- Specific Components -->
                        <optgroup data-i18n-label="group_specific" id="group-specific" style="display: none">
                            <option value="btn-translate" data-i18n="spec_btn_run_trans"></option>
                            <option value="btn-pause" data-i18n="spec_btn_pause"></option>
                            <option value="btn-stop" data-i18n="spec_btn_stop"></option>
                            <option value="btn-browse-file" data-i18n="spec_btn_select_file"></option>
                            <option value="btn-browse-dir" data-i18n="spec_btn_select_folder"></option>
                            <option value="btn-browse-output" data-i18n="spec_btn_output_dir"></option>
                            <option value="btn-browse-output-open" data-i18n="spec_btn_open_output"></option>
                            <option value="user-prompt" data-i18n="label_user_prompt"></option>
                            <option value="system-prompt" data-i18n="label_system_prompt"></option>
                            <option value="input-path" data-i18n="label_input_path"></option>
                            <option value="output-dir" data-i18n="spec_label_output"></option>
                            <option value="dict-dialog" data-i18n="spec_area_dict"></option>
                            <option value="log-output" data-i18n="label_log_area"></option>
                            <option value="progress-bar" data-i18n="spec_progress_current"></option>
                            <option value="batch-progress-bar" data-i18n="spec_progress_total"></option>
                        </optgroup>
                    </select>
                </div>
                <!-- [NEW] 屬性選擇 -->
                <div class="form-group" id="palette-property-group" style="display: none">
                    <label for="palette-property" data-i18n="label_palette_property"></label>
                    <select id="palette-property" style="width: 100%">
                        <option value="bg" data-i18n="label_bg_color">Background Color</option>
                        <option value="text" data-i18n="label_text_color">Text Color</option>
                        <option value="rounding" data-i18n="label_custom_rounding">Rounding</option>
                    </select>
                </div>
                <div class="form-group" id="palette-color-group">
                    <label for="palette-color" id="label-palette-color" data-i18n="label_palette_color"></label>
                    <input type="color" id="palette-color" autocomplete="off" />
                </div>
                <div class="form-group" id="palette-number-group" style="display: none">
                    <label for="palette-number" id="label-palette-number" data-i18n="label_palette_rounding"
                        >Value</label
                    >
                    <input
                        type="number"
                        id="palette-number"
                        value="4"
                        step="1"
                        style="width: 100%"
                        autocomplete="off"
                    />
                </div>
                <!-- [NEW] Specific Components歸零按鈕 -->
                <div class="form-group" id="palette-clear-group" style="display: none; align-items: flex-end">
                    <button
                        id="btn-palette-clear-item"
                        class="action-btn"
                        data-i18n="btn_palette_clear_item"
                        style="background-color: #aa1111; color: #fff; width: 100%; height: 38px"
                    >
                        🗑 Clear Override
                    </button>
                </div>
            </div>
            <div class="button-row mt-md" style="justify-content: flex-end">
                <button
                    id="btn-restore-palette"
                    class="action-btn"
                    data-i18n="btn_restore_defaults"
                    style="background-color: var(--secondary-color)"
                >
                    ⟲
                </button>
            </div>
            <!-- [NEW] 字體大小與圓角/動畫設定 -->
            <div class="form-grid" style="margin-top: 15px">
                <div class="form-group">
                    <label for="font-size" data-i18n="label_font_size">:</label>
                    <input type="number" id="font-size" value="15" min="12" max="30" step="0.5" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="btn-rounding-value" data-i18n="label_rounding_value">:</label>
                    <div style="display: flex; gap: 8px; align-items: center">
                        <input type="checkbox" id="chk-btn-rounding" checked style="width: 20px" />
                        <input
                            type="number"
                            id="btn-rounding-value"
                            value="4"
                            min="0"
                            max="20"
                            step="1"
                            style="flex: 1"
                            autocomplete="off"
                        />
                    </div>
                </div>
                <div class="form-group">
                    <label for="pulse-speed" data-i18n="label_anim_speed">:</label>
                    <div style="display: flex; gap: 8px; align-items: center">
                        <input type="checkbox" id="chk-pulse" checked style="width: 20px" />
                        <input
                            type="number"
                            id="pulse-speed"
                            value="1.0"
                            min="0.1"
                            max="5.0"
                            step="0.1"
                            style="flex: 1"
                            autocomplete="off"
                        />
                    </div>
                </div>
                <div class="form-group">
                    <label for="progress-style" data-i18n="label_progress_style">Bar Style:</label>
                    <select id="progress-style" style="width: 100%">
                        <option value="default" data-i18n="style_default">Default</option>
                        <option value="aurora" data-i18n="style_aurora">Aurora</option>
                        <option value="neon" data-i18n="style_neon">Neon</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 進度與日誌面板 -->
        <div class="status-section">
            <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px">
                <span id="label-items" style="color: var(--text-muted)" data-i18n="label_items"></span>
                <span id="batch-status-text" style="color: var(--text-muted)">0 / 0</span>
            </div>
            <div id="batch-progress-container">
                <div id="batch-progress-bar"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px">
                <span id="label-files" style="font-weight: bold" data-i18n="label_files"></span>
                <span id="status-text"></span>
            </div>
            <div id="progress-container"><div id="progress-bar"></div></div>
            <div id="log-output" style="margin-top: 10px"></div>
        </div>
    </body>
</html>
