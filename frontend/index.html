<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Minecraft 模組翻譯工具</title>
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="main.js" defer></script>
    </head>
    <body>
        <header class="top-navbar">
            <div class="nav-links">
                <button id="btn-nav-api" class="secondary-btn" title="API 與常數設置" data-i18n-title="btn_nav_settings">⚙️</button>
                <button id="btn-nav-dict" class="secondary-btn" title="字典管理器" data-i18n-title="btn_nav_dict">📖</button>
                <button id="btn-nav-palette" class="secondary-btn" title="佈景與色彩管理" data-i18n-title="btn_nav_palette">🎨</button>
                <button id="btn-nav-theme" class="secondary-btn" title="切換 Light/Dark 主題" data-i18n-title="btn_nav_theme">🌓</button>
                <button id="btn-nav-dev" class="secondary-btn" title="開發者過濾選項" data-i18n-title="btn_nav_dev">🔧</button>
            </div>
        </header>

        <!-- 🎮 翻譯控制面板 -->
        <div class="control-panel">
            <div class="form-group">
                <div class="label-row">
                    <label for="input-path" data-i18n="label_input_path">:</label>
                    <div class="row-buttons">
                        <button id="btn-browse-file" class="action-btn" data-i18n="btn_select_file">📂選擇檔案</button>
                        <button id="btn-browse-dir" class="action-btn" data-i18n="btn_select_folder">📁選擇資料夾</button>
                    </div>
                </div>
                <div class="input-row">
                    <input type="text" id="input-path" placeholder="輸入或拖放路徑至此..." data-i18n-placeholder="placeholder_input_path" />
                    <button class="clear-btn action-btn danger-hover" onclick="document.getElementById('input-path').value=''" data-i18n-title="btn_clear" title="清除">❌</button>
                </div>
            </div>

            <!-- [NEW] 輸出路徑 (100% 復刻) -->
            <div class="form-group mt-sm">
                <div class="label-row">
                    <label for="output-dir" data-i18n="label_output_path">输出资料夹路径:</label>
                    <div class="row-buttons">
                        <button id="btn-browse-output" class="action-btn" data-i18n="btn_output_dir">📁選擇資料夾</button>
                        <button id="btn-browse-output-open" class="action-btn" data-i18n="btn_open_output">📂打開資料夾</button>
                    </div>
                </div>
                <div class="input-row">
                    <input type="text" id="output-dir" placeholder="./LLMTranslator (預設)" data-i18n-placeholder="placeholder_output_path" />
                    <button class="clear-btn action-btn danger-hover" onclick="document.getElementById('output-dir').value=''" data-i18n-title="btn_clear" title="清除">❌</button>
                </div>
            </div>

            <!-- [NEW] 介面語言與導航列 (100% 復刻) -->
            <div class="form-group mt-sm">
                <label for="ui-lang" data-i18n="label_ui_lang">:</label>
                <select id="ui-lang" style="max-width: 150px; padding: 6px">
                    <option value="zh_tw">繁體中文 (zh_tw)</option>
                    <option value="zh_cn">简体中文 (zh_cn)</option>
                    <option value="ja_jp">日本語 (ja_jp)</option>
                    <option value="en_us">English (en_us)</option>
                </select>
            </div>

            <div class="button-row mt-md">
                <button id="btn-translate" data-i18n="btn_run_trans">🚀</button>
                <button id="btn-pause" style="display: none" data-i18n="btn_pause">⏸️</button>
                <button id="btn-resume" style="display: none" data-i18n="btn_resume">▶️</button>
                <button id="btn-stop" style="display: none; background-color: var(--danger-color)" data-i18n="btn_stop">⏹️</button>
                <span id="current-status-label" class="status-label ml-md" data-i18n="status_idle" style="margin-left: 15px; color: var(--text-muted);">待命</span>
            </div>
        </div>

        <!-- ⚙️ API 與常規參數面板 (100% 復刻) -->
        <div class="control-panel api-settings collapsible-panel">
<h2 id="header-api-settings" data-i18n="header_api_settings">⚙️ API</h2>
            <div class="form-grid">
                <div class="form-group">
<label for="api-provider" data-i18n="label_provider"></label>
                    <select id="api-provider">
                        <option value="Gemini">Gemini (Google)</option>
                        <option value="OpenAI">OpenAI</option>
                        <option value="DeepSeek">DeepSeek</option>
                        <option value="Mistral">Mistral</option>
                        <option value="DeepL">DeepL</option>
                        <option value="Ollama">Ollama (本地端)</option>
                        <option value="Google Free">Google Free</option>
                        <option value="無">無 (None)</option>
                    </select>
                </div>
                <div class="form-group" id="api-key-group">
<label for="api-key" data-i18n="label_api_key">API</label>
                    <input type="password" id="api-key" placeholder="輸入 API Key..." data-i18n-placeholder="placeholder_api_key" />
                </div>
                <div class="form-group">
<label for="selected-model" data-i18n="label_model"></label>
                    <select id="selected-model"></select>
                </div>
                <div class="form-group" id="ollama-url-group" style="display: none">
                    <label for="ollama-url" data-i18n="label_ollama_url">Ollama URL</label>
                    <input type="text" id="ollama-url" />
                </div>
                <div class="form-group">
                    <label for="batch-size" data-i18n="label_batch_size"></label>
                    <input type="number" id="batch-size" min="1" max="300" />
                </div>
                <div class="form-group">
<label for="batch-max-chars" data-i18n="label_max_chars"></label>
                    <input type="number" id="batch-max-chars" step="100" />
                </div>
                <div class="form-group">
<label for="timeout-sec" data-i18n="label_timeout">API</label>
                    <input type="number" id="timeout-sec" min="5" />
                </div>
            </div>
            
            <div class="form-grid" style="margin-top: 15px">
                <div class="form-group">
                    <label for="source-lang" id="label-source-lang" data-i18n="label_source_lang"></label>
                    <select id="source-lang">
                        <option value="en_us">English (US)</option>
                        <option value="zh_tw">繁體中文 (台灣)</option>
                        <option value="zh_cn">简体中文</option>
                        <option value="ja_jp">日本語</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="target-lang" id="label-target-lang" data-i18n="label_target_lang"></label>
                    <select id="target-lang">
                        <option value="zh_tw">繁體中文 (台灣)</option>
                        <option value="en_us">English (US)</option>
                        <option value="zh_cn">简体中文</option>
                        <option value="ja_jp">日本語</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pack-format" data-i18n="label_pack_format"></label>
                    <!-- [NEW] 使用 Select 以復刻常用版本下拉 -->
                    <select id="pack-format">
                        <option value="46">1.21.4 (46)</option>
                        <option value="42">1.21.2 (42)</option>
                        <option value="34">1.21 (34)</option>
                        <option value="22">1.20.4 (22)</option>
                        <option value="18">1.20.2 (18)</option>
                        <option value="15" selected>1.20.1 (15)</option>
                        <option value="13">1.19.4 (13)</option>
                        <option value="10">1.19.2 (10)</option>
                        <option value="9">1.18.2 (9)</option>
                        <option value="6">1.16.5 (6)</option>
                    </select>
                </div>
            </div>

            <!-- [NEW] 自訂 Prompts 設定區 -->
            <div style="margin-top: 15px">
                <div class="form-group" style="margin-top: 10px">
<label for="user-prompt" data-i18n="label_user_prompt">:</label>
                    <textarea
                        id="user-prompt"
                        rows="3"
                        style="
                            width: 100%;
                            box-sizing: border-box;
                            background: var(--input-bg);
                            color: #fff;
                            border: 1px solid #333;
                            border-radius: 4px;
                            padding: 8px;
                        "
                    ></textarea>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px">
                <button id="btn-save-config" data-i18n="btn_save_config" style="background-color: var(--accent-color); color: var(--btn-text-dark, #111); flex: 1">
                    💾 儲存核心參數
                </button>
                <button
                    id="btn-restore-config"
                    class="secondary-btn"
                    data-i18n="btn_restore_defaults"
                    style="background-color: var(--btn-bg); flex: 1; color: var(--btn-text); border: 1px solid var(--border-color)"
                >
                    🔄 恢復預設參數
                </button>
            </div>
        </div>

        <!-- 🔧 開發人員選項 -->
        <div class="control-panel developer-settings collapsible-panel">
<h2 id="header-dev-mode" data-i18n="header_dev_mode">🔧</h2>
            <div class="checkbox-grid">
                <div class="switch-group">
<span id="label-skip-json" data-i18n="label_skip_json">.json</span>
                    <label class="switch"
                        ><input type="checkbox" id="chk-skip-json" /><span class="slider round"></span
                    ></label>
                </div>
                <div class="switch-group">
<span id="label-skip-js" data-i18n="label_skip_js">.js</span>
                    <label class="switch"
                        ><input type="checkbox" id="chk-skip-js" /><span class="slider round"></span
                    ></label>
                </div>
                <div class="switch-group">
<span id="label-skip-jar" data-i18n="label_skip_jar">.jar</span>
                    <label class="switch"
                        ><input type="checkbox" id="chk-skip-jar" /><span class="slider round"></span
                    ></label>
                </div>
                <div class="switch-group">
<span id="label-skip-book" data-i18n="label_skip_book">Patchouli</span>
                    <label class="switch"
                        ><input type="checkbox" id="chk-skip-book" /><span class="slider round"></span
                    ></label>
                </div>
            </div>
            
            <div class="checkbox-grid" style="margin-top: 15px">
                <div class="switch-group">
                    <span id="label-llm-log">LLM</span>
                    <label class="switch">
                        <input type="checkbox" id="chk-llm-log" />
                        <span class="slider round"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- 🎨 調色盤與佈局管理面板 -->
        <div class="control-panel theme-settings collapsible-panel">
<h2 id="header-palette" data-i18n="header_palette">🎨</h2>
            <div class="form-grid">
                <div class="form-group">
<label for="palette-target-type" data-i18n="label_palette_target_type"></label>
                    <select id="palette-target-type" style="width: 100%">
                        <option value="global">全域樣式</option>
                        <option value="specific">特定元件覆寫</option>
                    </select>
                </div>
                <div class="form-group">
<label for="palette-target-item" data-i18n="label_palette_target_item"></label>
                    <select id="palette-target-item" style="width: 100%">
                        <!-- 全域類別 -->
                        <optgroup label="全域類別" id="group-global">
                            <option value="dark_bg">背景顏色</option>
                            <option value="dark_text">文字顏色</option>
                            <option value="dark_label">全部標籤顏色</option>
                            <option value="dark_btn_bg">按鈕背景</option>
                            <option value="dark_btn_text">按鈕文字</option>
                            <option value="dark_input_bg">輸入框背景</option>
                            <option value="dark_list_bg">日誌與列表背景</option>
                            <option value="dark_tab_active">分頁背景 (選中)</option>
                            <option value="dark_tab_inactive">分頁背景 (未選中)</option>
                        </optgroup>
                        <!-- 特定元件 (透過 JS 控制覆寫) -->
                        <optgroup label="特定元件" id="group-specific" style="display: none">
                            <option value="btn-translate">🚀 立即翻譯按鈕</option>
                            <option value="btn-pause">⏸️ 暫停按鈕</option>
                            <option value="btn-stop">⏹️ 停止按鈕</option>
                            <option value="btn-browse-file">📁 開啟單檔按鈕</option>
                            <option value="btn-browse-dir">📁 開啟資料夾按鈕</option>
                            <option value="btn-browse-output">📁 瀏覽輸出按鈕</option>
                            <option value="btn-browse-output-open">📂 打開輸出按鈕</option>
                            <option value="user-prompt">📝 使用者提示詞框</option>
                            <option value="system-prompt">🔧 系統提示詞框</option>
                            <option value="input-path">🔗 來源路徑輸入框</option>
                            <option value="output-dir">🔗 輸出路徑輸入框</option>
                            <option value="dict-dialog">📖 字典視窗</option>
                            <option value="log-output">📋 日誌輸出框</option>
                            <option value="progress-bar">📊 檔案進度條</option>
                            <option value="batch-progress-bar">📊 條目進度條</option>
                        </optgroup>
                    </select>
                </div>
                <!-- [NEW] 屬性選擇 -->
                <div class="form-group" id="palette-property-group" style="display: none">
<label for="palette-property" data-i18n="label_palette_property"></label>
                    <select id="palette-property" style="width: 100%">
                        <option value="bg">背景顏色</option>
                        <option value="text">文字顏色</option>
                        <option value="rounding">圓角大小</option>
                    </select>
                </div>
                <div class="form-group" id="palette-color-group">
<label for="palette-color" id="label-palette-color" data-i18n="label_palette_color"></label>
                    <input
                        type="color"
                        id="palette-color"
                        style="
                            width: 100%;
                            height: 38px;
                            padding: 0;
                            border: 1px solid #444;
                            cursor: pointer;
                            border-radius: 4px;
                        "
                    />
                </div>
                <div class="form-group" id="palette-rounding-group" style="display: none">
<label for="palette-rounding" data-i18n="label_palette_rounding"></label>
                    <input
                        type="number"
                        id="palette-rounding"
                        value="4"
                        min="0"
                        max="20"
                        step="1"
                        style="width: 100%"
                    />
                </div>
                <!-- [NEW] 特定元件歸零按鈕 -->
                <div class="form-group" id="palette-clear-group" style="display: none; align-items: flex-end">
                    <button
                        id="btn-palette-clear-item"
                        class="action-btn"
                        data-i18n="btn_palette_clear_item"
                        style="background-color: #aa1111; color: #fff; width: 100%; height: 38px"
                    >
                        🗑 清除元件覆寫
                    </button>
                </div>
            </div>
            <!-- [NEW] 字體大小與圓角/動畫設定 -->
            <div class="form-grid" style="margin-top: 15px">
                <div class="form-group">
<label for="font-size" data-i18n="label_font_size">:</label>
                    <input type="number" id="font-size" value="15" min="12" max="30" step="0.5" />
                </div>
                <div class="form-group">
<label for="btn-rounding-value" data-i18n="label_rounding_value">:</label>
                    <div style="display: flex; gap: 8px; align-items: center">
                        <input type="checkbox" id="chk-btn-rounding" checked style="width: 20px" />
                        <input
                            type="number"
                            id="btn-rounding-value"
                            value="4"
                            min="0"
                            max="20"
                            step="1"
                            style="flex: 1"
                        />
                    </div>
                </div>
                <div class="form-group">
<label for="pulse-speed" data-i18n="label_anim_speed">:</label>
                    <div style="display: flex; gap: 8px; align-items: center">
                        <input type="checkbox" id="chk-pulse" checked style="width: 20px" />
                        <input
                            type="number"
                            id="pulse-speed"
                            value="1.0"
                            min="0.1"
                            max="5.0"
                            step="0.1"
                            style="flex: 1"
                        />
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px">
<button id="btn-save-style" style="flex: 1" data-i18n="btn_save_style">💾</button>
                <button
                    id="btn-restore-style"
                    class="secondary-btn"
                    data-i18n="btn_restore_defaults"
                    style="background-color: var(--btn-bg); flex: 1; color: var(--btn-text); border: 1px solid var(--border-color)"
                >
                    🔄 恢復預設樣式
                </button>
            </div>

        <!-- 進度與日誌面板 -->
        <div class="status-section">
            <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px">
<span id="label-items" style="color: var(--text-muted)"></span>
                <span id="batch-status-text" style="color: var(--text-muted); display: none">0 / 0</span>
            </div>
            <div
                id="batch-progress-container"
                style="
                    height: 6px;
                    margin-bottom: 8px;
                    background-color: #222;
                    border-radius: 3px;
                    overflow: hidden;
                    display: none;
                "
            >
                <div
                    id="batch-progress-bar"
                    style="background-color: var(--accent-color); width: 0%; height: 100%; transition: width 0.2s"
                ></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px">
<span id="label-files" style="color: #ddd; font-weight: bold"></span>
<span id="status-text" style="color: #ddd"></span>
            </div>
            <div id="progress-container"><div id="progress-bar"></div></div>
            <div id="log-output" style="margin-top: 10px"></div>
        </div>

    </body>
</html>
