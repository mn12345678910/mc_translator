<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Suggestion Manager</title>
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="dict_main.js" defer></script>
        <style>
            body {
                margin: 0;
                padding: 15px;
                height: 100vh;
                display: flex;
                flex-direction: column;
                background-color: var(--bg-color);
                color: var(--text-color);
                box-sizing: border-box;
            }
            .dialog-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border-light);
                padding-bottom: 10px;
                margin-bottom: 15px;
                flex-shrink: 0;
            }
            .dialog-body {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow-y: auto;
            }
            .dialog-footer {
                padding-top: 10px;
                border-top: 1px solid var(--border-light);
                display: flex;
                justify-content: center;
                flex-shrink: 0;
            }
            .table-container {
                flex: 1;
                overflow-y: auto;
                margin-top: 15px;
            }
        </style>
    </head>
    <body>
        <div class="dialog-header">
            <!-- 術語優先級切換開關 -->
            <div class="switch-group" style="background: transparent; border: none; padding: 0; margin-left: auto; margin-right: 15px; gap: 8px; display: flex; align-items: center;">
                <span id="label-glossary-priority" data-i18n="label_glossary_priority" style="font-size: 0.9rem;">Priority:</span>
                <label class="switch" title="切換 官方優先 或 使用者優先">
                    <input type="checkbox" id="chk-glossary-priority" />
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <div class="dialog-body">
            <!-- 分頁與按鈕行 -->
            <div class="tabs flex-between" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; gap: 10px;">
                    <button class="tab-btn active" id="tab-user" data-i18n="glossary_tab_user">User Glossary</button>
                    <button class="tab-btn" id="tab-official" data-i18n="glossary_tab_official">Official Glossary</button>
                </div>
                <!-- 按鈕群組 -->
                <div id="dict-user-buttons" class="flex-wrap" style="display: flex; gap: 8px;">
                    <button id="btn-dict-add" class="action-btn" title="Add Entry">➕</button>
                    <button id="btn-dict-replace" class="action-btn" title="Replace Existing">🔄</button>
                    <button id="btn-dict-import" class="action-btn" title="Import">📥</button>
                    <button id="btn-dict-export" class="action-btn" title="Export">📤</button>
                    <button id="btn-dict-open-json" class="action-btn" title="Open Folder">📂 .json</button>
                    <button id="btn-dict-clear" class="action-btn" title="Clear All">🗑</button>
                </div>
            </div>

            <!-- 輸入與搜尋區 -->
            <div id="dict-user-controls" class="flex-wrap mt-sm" style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="dict-input-key" placeholder="Original (Key)" style="flex: 1; min-width: 140px; padding: 8px;" autocomplete="off" />
                <input type="text" id="dict-input-value" placeholder="Translation (Value)" style="flex: 1; min-width: 140px; padding: 8px;" autocomplete="off" />
                <div class="search-bar" style="margin-left: auto;">
                    <input type="text" id="dict-search" placeholder="🔍 Search..." style="width: 180px; padding: 8px 10px; font-size: 0.9rem;" autocomplete="off" />
                </div>
            </div>

            <div class="table-container" id="dict-table-container"></div>
        </div>

        <div class="dialog-footer">
            <div class="pagination" style="display: flex; gap: 10px; align-items: center;">
                <button id="page-prev" class="page-btn">Previous</button>
                <span id="page-info">1 / 1</span>
                <button id="page-next" class="page-btn">Next</button>
            </div>
        </div>
    </body>
</html>
