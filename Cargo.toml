[package]
name = "mc_translator_rs"
version = "0.5.9"



edition = "2021"
default-run = "mc_translator_cli"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
keyring = "3"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4.0"
once_cell = "1"
regex = "1.10"
reqwest = { version = "0.11", features = ["json", "cookies", "stream"] }
zip = "0.6"
urlencoding = "2.1"
hanconv = "0.4"
dotenvy = "0.15"
chrono = "0.4"
base64 = "0.21"
walkdir = "2.5.0"
aho-corasick = "1.1"
bytes = "1.5"
dialoguer = "0.11"
clap = { version = "4.4", features = ["derive"] }


[[bin]]
name = "mc_translator_cli"
path = "src/cli/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
