[package]
name = "mc_translator"
version = "0.9.14"
license = "MIT"
edition = "2021"
default-run = "mc_translator_cli"

[workspace]
members = [".", "src-tauri"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
zeroize = "1"
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4.0"
once_cell = "1"
regex = "1.10"
reqwest = { version = "0.13", features = ["json", "cookies", "stream", "form", "native-tls"] }
zip = "8.5"
urlencoding = "2.1"
hanconv = "0.5"
chrono = "0.4"
walkdir = "2.5.0"
aho-corasick = "1.1"
bytes = "1.5"
dialoguer = "0.12"
clap = { version = "4.5", features = ["derive"] }


[[bin]]
name = "mc_translator_cli"
path = "src/cli/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6"
# 沿用現有依賴或新增測試與 Mocked 必要項
