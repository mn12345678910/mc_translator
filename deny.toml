# cargo-deny v2 format
# 參考：https://embarkstudios.github.io/cargo-deny/

[advisories]
# 不需 db-path/db-urls，使用 Action 預設值即可
# v2 中 vulnerability/notice 欄位已移除（所有 advisory 默認為 deny）
# unmaintained 的值為範圍：all | workspace | transitive | none
unmaintained = "none"
yanked = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.8
copyleft = "warn"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
