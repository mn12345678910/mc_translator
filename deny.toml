# cargo-deny v2 configuration
# 官方文件: https://embarkstudios.github.io/cargo-deny/

[advisories]
# v2 中 vulnerability/unsound/notice 等欄位已移除，違規 advisory 一律報錯
# unmaintained 的值為範圍: all | workspace | transitive | none
unmaintained = "none"
# yanked: deny | warn | allow
yanked = "warn"
ignore = []

[licenses]
# v2 中 unlicensed/copyleft 欄位已移除
# 所有未列於 allow 清單中的授權預設拒絕
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
