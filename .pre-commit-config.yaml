repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: check-merge-conflict
  - id: detect-private-key
  - id: check-added-large-files

- repo: local
  hooks:
  - id: cargo-fmt
    name: cargo fmt
    entry: cargo fmt --all
    language: system
    types: [rust]
    pass_filenames: false

  - id: cargo-clippy
    name: cargo clippy
    entry: cargo clippy --workspace --all-targets -- -D warnings
    language: system
    types: [rust]
    pass_filenames: false

  - id: cargo-test
    name: cargo test
    entry: cargo test --all-features
    language: system
    stages: [pre-push]
    pass_filenames: false

  - id: pnpm-format
    name: pnpm format
    entry: pnpm format
    language: system
    stages: [pre-commit, pre-push]
    pass_filenames: false

  - id: check-i18n-keys
    name: check i18n keys
    entry: node tool/check_i18n_keys.js
    language: system
    files: \.json$
    pass_filenames: false

  - id: pnpm-lint
    name: pnpm lint
    entry: pnpm lint
    language: system
    stages: [pre-push]
    pass_filenames: false

  - id: pnpm-test
    name: pnpm test
    entry: pnpm test
    language: system
    stages: [pre-push]
    pass_filenames: false

  - id: cleanup-redundant-files
    name: cleanup redundant files
    entry: pwsh -Command "Remove-Item -Path 'repro_serde.rs', 'ci_log.txt', 'job_log.txt', 'ci_failure.log', 'miri_failure*.log' -ErrorAction SilentlyContinue; Remove-Item -Path 'LLMTranslator', 'dist' -Recurse -Force -ErrorAction SilentlyContinue; exit 0"
    language: system
    stages: [pre-commit, pre-push]
    pass_filenames: false
