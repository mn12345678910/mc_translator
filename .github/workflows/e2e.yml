name: E2E Tests (Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    name: Run E2E on Linux Xvfb
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Application for Linux
      run: cargo build --manifest-path src-tauri/Cargo.toml

    - name: Fool Tauri Service Binary Check
      run: |
        mkdir -p src-tauri/target/release
        BINARY_PATH=$(find target -type f -executable | grep -v -E "mc_translator_cli|\.d$|/deps/|/examples/|/build/" | head -n 1)

        echo "Found representative binary: $BINARY_PATH"
        if [ -z "$BINARY_PATH" ]; then
          echo "ERROR: Couldn't find appropriate GUI binary in target folder!"
          exit 1
        fi
        ln -s "$(pwd)/$BINARY_PATH" src-tauri/target/release/mc_translator


    - name: Run E2E Tests
      env:
        TAURI_BINARY_PATH: ./target/debug/app
      run: |
        # 啟動 Xvfb 並執行 WebdriverIO 測試
        xvfb-run -a npx wdio run wdio.conf.mjs
