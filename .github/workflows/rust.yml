name: Rust CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  ci-linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .
          src-tauri
    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - name: Check Formatting
      run: cargo fmt -- --check
    - name: Clippy (Linter)
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Check CLI
      run: cargo check --workspace
    - name: Security Audit
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: License & Duplicate Check (Deny)
      uses: EmbarkStudios/cargo-deny-action@v2
    - name: Install Nextest & Udeps
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest,cargo-udeps
    - name: Unused Dependencies (Udeps)
      env:
        RUSTC_BOOTSTRAP: 1
      run: cargo udeps --workspace --all-targets
    - name: Run Tests (Nextest)
      run: cargo nextest run --workspace --all-targets
    - name: Generate Documentation
      run: cargo doc --workspace --no-deps
    - name: Upload Documentation
      uses: actions/upload-artifact@v7
      with:
        name: rustdoc
        path: target/doc
    - name: Run Tests GUI (Legacy for Tauri compatibility if needed)
      run: cargo test --manifest-path src-tauri/Cargo.toml
    - name: Install llvm-cov (Coverage Tool)
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: Run Coverage
      run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./lcov.info
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload Rust Coverage
      uses: actions/upload-artifact@v7

      with:
        name: rust-coverage
        path: lcov.info


  build-cli:
    name: Build CLI (Windows)
    runs-on: windows-latest
    needs: ci-linux
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .
    - name: Build CLI Release
      run: cargo build --release --bin mc_translator_cli
    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mc_translator_cli
        path: target/release/mc_translator_cli.exe
        if-no-files-found: error

  build-gui:
    name: Build GUI (Windows)
    runs-on: windows-latest
    needs: ci-linux
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'
        cache: 'npm'
    - name: Install Node Dependencies
      run: npm ci
    - name: Build Tauri GUI Action
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Rename GUI Binary
      shell: pwsh
      run: |
        $found = $false
        $paths = @(
            "target/release/app.exe",
            "target/release/mc_translator.exe",
            "target/release/mc_translator_rs.exe",
            "src-tauri/target/release/app.exe",
            "src-tauri/target/release/mc_translator.exe",
            "src-tauri/target/release/mc_translator_rs.exe"
        )
        foreach ($p in $paths) {
            if (Test-Path $p) {
                Copy-Item $p -Destination "./mc_translator_gui.exe" -Force
                $found = $true
                break
            }
        }
        if (-not $found) {
            Write-Warning "Could not find any GUI binary in target directories!"
            if (Test-Path "target/release") { Get-ChildItem -Path "target/release" -Filter "*.exe" }
            if (Test-Path "src-tauri/target/release") { Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" }
            exit 1
        }
    - name: Upload GUI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mc_translator_gui
        path: mc_translator_gui.exe
        if-no-files-found: error



  release:
    name: Create Release
    needs: [build-cli, build-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # git-cliff 需要完整歷史來生成日誌

    - name: Download CLI Artifact
      uses: actions/download-artifact@v8
      with:
        name: mc_translator_cli
        path: .
    - name: Download GUI Artifact
      uses: actions/download-artifact@v8
      with:
        name: mc_translator_gui
        path: .
    - name: Generate Changelog
      uses: orhun/git-cliff-action@v4
      id: git-cliff
      with:
        config: cliff.toml
        args: --verbose --latest --strip header
      env:
        OUTPUT: CHANGELOG.md
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body: ${{ steps.git-cliff.outputs.content }}
        files: |
          mc_translator_cli.exe
          mc_translator_gui.exe
        generate_release_notes: false # 關閉 GitHub 預設日誌，改用 git-cliff

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
