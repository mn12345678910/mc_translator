name: Rust CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  ci-linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .
          src-tauri
    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - name: Check Formatting
      run: cargo fmt -- --check
    - name: Check CLI
      run: cargo check
    - name: Run Tests CLI
      run: cargo test
    - name: Check GUI
      run: cargo check --manifest-path src-tauri/Cargo.toml
    - name: Run Tests GUI
      run: cargo test --manifest-path src-tauri/Cargo.toml

  build-cli:
    name: Build CLI (Windows)
    runs-on: windows-latest
    needs: ci-linux
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .
    - name: Build CLI Release
      run: cargo build --release --bin mc_translator_cli
    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mc_translator_cli
        path: target/release/mc_translator_cli.exe
        if-no-files-found: error

  build-gui:
    name: Build GUI (Windows)
    runs-on: windows-latest
    needs: ci-linux
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'
        cache: 'npm'
    - name: Install Node Dependencies
      run: npm ci
    - name: Build Tauri GUI Action
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Rename GUI Binary
      shell: pwsh
      run: |
        $found = $false
        $paths = @(
            "target/release/app.exe",
            "target/release/mc_translator.exe",
            "target/release/mc_translator_rs.exe",
            "src-tauri/target/release/app.exe",
            "src-tauri/target/release/mc_translator.exe",
            "src-tauri/target/release/mc_translator_rs.exe"
        )
        foreach ($p in $paths) {
            if (Test-Path $p) {
                Copy-Item $p -Destination "./mc_translator_gui.exe" -Force
                $found = $true
                break
            }
        }
        if (-not $found) {
            Write-Warning "Could not find any GUI binary in target directories!"
            if (Test-Path "target/release") { Get-ChildItem -Path "target/release" -Filter "*.exe" }
            if (Test-Path "src-tauri/target/release") { Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" }
            exit 1
        }
    - name: Upload GUI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mc_translator_gui
        path: mc_translator_gui.exe
        if-no-files-found: error



  release:
    name: Create Release
    needs: [build-cli, build-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download CLI Artifact
      uses: actions/download-artifact@v8
      with:
        name: mc_translator_cli
    - name: Download GUI Artifact
      uses: actions/download-artifact@v8
      with:
        name: mc_translator_gui
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          mc_translator_cli.exe
          *.exe

        generate_release_notes: true

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
