name: Rust CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Check
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo check --verbose
    - name: Run Tests
      run: cargo test --verbose
    - name: Build Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: cargo build --release --verbose
    - name: Setup Node.js
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'
        cache: 'npm'
    - name: Install Node Dependencies
      if: startsWith(github.ref, 'refs/tags/v')
      run: npm ci
    - name: Build Tauri GUI
      if: startsWith(github.ref, 'refs/tags/v')
      run: npx tauri build
    - name: Copy Binaries to Workspace
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: |
        # 1. 複製 CLI
        if (Test-Path "../cargo-target/release/mc_translator_cli.exe") { Copy-Item "../cargo-target/release/mc_translator_cli.exe" -Destination "./mc_translator_cli.exe" -Force }
        if (Test-Path "./target/release/mc_translator_cli.exe") { Copy-Item "./target/release/mc_translator_cli.exe" -Destination "./mc_translator_cli.exe" -Force }

        # 2. 複製 GUI (僅要純 .exe)
        $gui_paths = @(
            "src-tauri/target/release/mc_translator_rs.exe",
            "src-tauri/target/release/mc_translator.exe",
            "src-tauri/target/release/app.exe",
            "target/release/mc_translator.exe",
            "target/release/app.exe"
        )
        foreach ($p in $gui_paths) {
            if (Test-Path $p) { 
                Copy-Item $p -Destination "./mc_translator_gui.exe" -Force 
                break
            }
        }
    - name: Upload Artifact
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: mc_translator_rs-windows
        path: |
          mc_translator_cli.exe
          *.exe



  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v7
      with:
        name: mc_translator_rs-windows
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          mc_translator_cli.exe
          *.exe

        generate_release_notes: true

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
