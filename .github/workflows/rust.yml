name: Rust CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  ci-linux:
    name: Check & Test (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .
          src-tauri
    - name: Check
      run: cargo check
    - name: Run Tests
      run: cargo test

  build-cli:
    name: Build CLI (Windows)
    runs-on: windows-latest
    needs: ci-linux
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .
    - name: Build CLI Release
      run: cargo build --release -p mc_translator_cli
    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mc_translator_cli
        path: target/release/mc_translator_cli.exe

  build-gui:
    name: Build GUI (Windows)
    runs-on: windows-latest
    needs: ci-linux
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'
        cache: 'npm'
    - name: Install Node Dependencies
      run: npm ci
    - name: Build Tauri GUI Action
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Rename GUI Binary
      shell: pwsh
      run: |
        if (Test-Path "src-tauri/target/release/app.exe") { Copy-Item "src-tauri/target/release/app.exe" -Destination "./mc_translator_gui.exe" -Force }
        if (Test-Path "src-tauri/target/release/mc_translator.exe") { Copy-Item "src-tauri/target/release/mc_translator.exe" -Destination "./mc_translator_gui.exe" -Force }
        if (Test-Path "src-tauri/target/release/mc_translator_rs.exe") { Copy-Item "src-tauri/target/release/mc_translator_rs.exe" -Destination "./mc_translator_gui.exe" -Force }
    - name: Upload GUI Artifact
      uses: actions/upload-artifact@v7
      with:
        name: mc_translator_gui
        path: mc_translator_gui.exe



  release:
    name: Create Release
    needs: [build-cli, build-gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download CLI Artifact
      uses: actions/download-artifact@v7
      with:
        name: mc_translator_cli
    - name: Download GUI Artifact
      uses: actions/download-artifact@v7
      with:
        name: mc_translator_gui
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          mc_translator_cli.exe
          *.exe

        generate_release_notes: true

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
