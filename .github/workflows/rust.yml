name: Rust CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Check
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Check
      run: cargo check --verbose
    - name: Run Tests
      run: cargo test --verbose
    - name: Build Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: cargo build --release --verbose
    - name: Copy Binary to Workspace
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: Copy-Item -Path ../cargo-target/release/mc_translator_rs.exe -Destination ./mc_translator_rs.exe
    - name: Upload Artifact
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: mc_translator_rs-windows
        path: mc_translator_rs.exe

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v7
      with:
        name: mc_translator_rs-windows
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: mc_translator_rs.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
